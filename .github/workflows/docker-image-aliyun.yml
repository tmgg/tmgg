name: Aliyun Docker Base Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  push_to_registry:
    name: Push Docker image to Aliyun
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses:  docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: hustme
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: tmgg-base-node
        uses: docker/build-push-action@v6
        with:
          file: ./docker-base/tmgg-base-node/Dockerfile
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/mxvc/tmgg-base-node:${{ steps.meta.outputs.version }}
            registry.cn-hangzhou.aliyuncs.com/mxvc/tmgg-base-node:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}



      - name: tmgg-base-maven
        uses: docker/build-push-action@v6
        with:
          file: ./docker-base/tmgg-base-maven/Dockerfile
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/mxvc/tmgg-base-maven:${{ steps.meta.outputs.version }}
            registry.cn-hangzhou.aliyuncs.com/mxvc/tmgg-base-maven:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}


      - name: tmgg-base-jdk
        uses: docker/build-push-action@v6
        with:
          file: ./docker-base/tmgg-base-jdk/Dockerfile
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/mxvc/tmgg-base-jdk:${{ steps.meta.outputs.version }}
            registry.cn-hangzhou.aliyuncs.com/mxvc/tmgg-base-jdk:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
